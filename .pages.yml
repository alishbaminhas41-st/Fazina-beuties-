
media:
  input: images
  output: /images

content:
  - name: products
    label: FAZINA BEAUTIES Products
    type: collection
    path: products
    format: json
    fields:
      - name: name
        label: Product Name
        type: string
        required: true

      - name: price
        label: Price (PKR)
        type: number

      - name: description
        label: Description
        type: text

      - name: category
        label: Category
        type: string

      - name: image
        label: Product Picture
        type: image

      - name: available
        label: Available
        type: boolean
        